<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 行情與風控助手</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #131b31;
      --card-2: #1a2440;
      --text: #eef2ff;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --up: #22c55e;
      --down: #ef4444;
      --warn: #f59e0b;
      --border: rgba(148, 163, 184, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px 14px 88px;
    }
    .container { max-width: 680px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #172554, #0f172a);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .header h1 { margin: 0 0 4px; font-size: 1.25rem; }
    .header p { margin: 0; color: var(--muted); font-size: 0.85rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    select, input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 0.95rem;
    }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
    .chip {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .chip:active { transform: scale(0.98); }
    .btn-row { display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px; }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #061224;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
    }
    .btn-rec {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #052e16;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .track-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .track-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .rr-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--up);
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .status-banner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      background: var(--card-2);
      margin-bottom: 10px;
    }
    .tag-up { color: var(--up); font-weight: 700; }
    .tag-down { color: var(--down); font-weight: 700; }
    .tag-warn { color: var(--warn); font-weight: 700; }
    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .metric { background: var(--card-2); padding: 10px; border-radius: 10px; }
    .metric .k { font-size: 0.75rem; color: var(--muted); }
    .metric .v { font-size: 1.05rem; font-weight: 700; margin-top: 2px; word-break: break-word; }
    .rec-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    .rec-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .rec-meta { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
    .news-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; line-height: 1.45; }
    .news-item:last-child { border-bottom: none; }
    .err { color: #fca5a5; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.35); padding: 10px; border-radius: 10px; }
    .disclaimer { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📱 AI 行情與風控助手</h1>
      <p>雙軌並行：股票順均線控波段・加密幣極短線緊停損防洗盤</p>
    </div>

    <div class="card">
      <div class="grid-2">
        <div>
          <label for="market">市場類別</label>
          <select id="market">
            <option value="加密貨幣">加密貨幣</option>
            <option value="美股">美股</option>
            <option value="台股">台股</option>
          </select>
        </div>
        <div>
          <label for="days">預測天數（0.05～15）</label>
          <input id="days" type="number" min="0.05" max="15" step="0.05" value="0.1" />
        </div>
      </div>

      <div style="margin-top:10px;">
        <label for="symbol">標的代碼</label>
        <input id="symbol" type="text" value="BTC-USD" placeholder="例如 BTC-USD、NVDA、2330.TW" />
      </div>

      <div id="presets" class="presets"></div>

      <div class="grid-2" style="margin-bottom:12px;">
        <div>
          <label for="capital">本金（選填，風控試算）</label>
          <input id="capital" type="number" step="any" placeholder="例如 10000" />
        </div>
        <div>
          <label for="leverage">槓桿倍數（選填）</label>
          <input id="leverage" type="number" step="any" placeholder="例如 1、5 或 10" />
        </div>
      </div>

      <div class="btn-row">
        <button id="runBtn" type="button" class="btn">開始分析</button>
        <button id="recBtn" type="button" class="btn btn-rec">⭐ 篩選高勝率推薦</button>
      </div>
    </div>

    <div id="resultArea"></div>
    <div class="disclaimer">僅供量化分析與風控參考，不構成投資建議；高勝率門檻仍不保證獲利，請嚴控風險。</div>
  </div>

  <script id="presets-data" type="application/json">{{ presets_json | safe }}</script>
  <script>
    const PRESETS = JSON.parse(document.getElementById("presets-data").textContent || "{}");

    function setButtonsDisabled(disabled) {
      document.getElementById("runBtn").disabled = disabled;
      document.getElementById("recBtn").disabled = disabled;
    }

    function renderPresets() {
      const m = document.getElementById("market").value;
      const box = document.getElementById("presets");
      const list = PRESETS[m] || [];
      box.innerHTML = "";
      list.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = item.label;
        btn.addEventListener("click", () => {
          document.getElementById("symbol").value = item.symbol;
          document.getElementById("symbol").dataset.manual = "1";
          runAnalyze();
        });
        box.appendChild(btn);
        if (idx === 0 && !document.getElementById("symbol").dataset.manual) {
          document.getElementById("symbol").value = item.symbol;
        }
      });
    }

    async function runAnalyze() {
      const btn = document.getElementById("runBtn");
      const area = document.getElementById("resultArea");
      const symVal = (document.getElementById("symbol").value || "BTC-USD").trim();

      setButtonsDisabled(true);
      btn.textContent = "分析中...";
      area.innerHTML = `<div class="card">正在運算 <b>${symVal}</b>，首次連線若遇休眠喚醒約需 30～60 秒...</div>`;

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 75000);

      try {
        const payload = {
          market: document.getElementById("market").value,
          symbol: symVal,
          days: Number(document.getElementById("days").value || 0.1),
          capital: document.getElementById("capital").value,
          leverage: document.getElementById("leverage").value,
        };
        const resp = await fetch("/api/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal,
        });
        const rawText = await resp.text();
        let data = {};
        try {
          data = rawText ? JSON.parse(rawText) : {};
        } catch (_) {
          throw new Error(`伺服器回應格式異常（狀態碼 ${resp.status}）`);
        }
        if (!resp.ok || data.error) {
          throw new Error(data.error || `查詢失敗（狀態碼 ${resp.status}）`);
        }
        renderResult(data);
      } catch (err) {
        const msg = err && err.name === "AbortError"
          ? "連線逾時（Render 剛喚醒或行情源回應較慢），請再按一次「開始分析」"
          : (err && err.message ? err.message : "未知錯誤");
        area.innerHTML = `<div class="card err">❌ ${msg}</div>`;
      } finally {
        clearTimeout(timer);
        setButtonsDisabled(false);
        btn.textContent = "開始分析";
      }
    }

    async function runRecommend() {
      const btn = document.getElementById("recBtn");
      const area = document.getElementById("resultArea");
      const marketVal = document.getElementById("market").value;
      const daysVal = Number(document.getElementById("days").value || 0.1);

      setButtonsDisabled(true);
      btn.textContent = "掃描中...";
      area.innerHTML = `<div class="card">正在掃描「<b>${marketVal}</b>」預設標的（${daysVal}日），篩選<b>勝率極高</b>機會...</div>`;

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 90000);

      try {
        const payload = {
          market: marketVal,
          days: daysVal,
          capital: document.getElementById("capital").value,
          leverage: document.getElementById("leverage").value,
        };
        const resp = await fetch("/api/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal,
        });
        const rawText = await resp.text();
        let data = {};
        try {
          data = rawText ? JSON.parse(rawText) : {};
        } catch (_) {
          throw new Error(`伺服器回應格式異常（狀態碼 ${resp.status}）`);
        }
        if (!resp.ok || data.error) {
          throw new Error(data.error || `篩選失敗（狀態碼 ${resp.status}）`);
        }
        renderRecommendations(data);
      } catch (err) {
        const msg = err && err.name === "AbortError"
          ? "掃描逾時，請再按一次「篩選高勝率推薦」"
          : (err && err.message ? err.message : "未知錯誤");
        area.innerHTML = `<div class="card err">❌ ${msg}</div>`;
      } finally {
        clearTimeout(timer);
        setButtonsDisabled(false);
        btn.textContent = "⭐ 篩選高勝率推薦";
      }
    }

    function renderRecommendations(data) {
      const area = document.getElementById("resultArea");
      const recs = data.recommendations || [];

      if (!recs.length) {
        area.innerHTML = `
          <div class="card">
            <div class="track-badge">🛡️ 嚴格高勝率篩選</div>
            <div style="font-size:1.05rem;font-weight:700;margin-top:8px;color:var(--warn);">目前沒有符合「極高勝率」門檻的標的</div>
            <div class="rec-meta" style="margin-top:6px;">
              篩選標準：${data.criteria || "機率、驗證準確與盈虧比需同時達標"}<br/>
              建議：寧可空手等高確定性機會，也不要在門檻未達標時硬做單。
            </div>
          </div>`;
        return;
      }

      const cardsHtml = recs.map((r, i) => {
        const dirClass = r.direction.includes("多") ? "tag-up" : "tag-down";
        return `
          <div class="rec-item">
            <div class="rec-top">
              <div>
                <b>#${i + 1} ${r.symbol}</b> <span class="${dirClass}">${r.direction}</span>
              </div>
              <span class="rr-badge">勝率 ${r.win_prob_display}%・1:${r.rr_ratio}</span>
            </div>
            <div class="rec-meta">
              現價：<b>${r.last_price}</b>｜入場：<b>${r.entry_price}</b>｜停損/停利：<b>${r.stop_loss} / ${r.take_profit}</b><br/>
              驗證準確：${r.test_accuracy}%｜綜合評分：${r.edge_score}｜${r.action}
            </div>
            <div style="margin-top:8px;">
              <button type="button" class="chip" onclick="selectAndAnalyze('${r.symbol}')">帶入並看完整分析</button>
            </div>
          </div>`;
      }).join("");

      area.innerHTML = `
        <div class="card">
          <div class="track-row">
            <span class="track-badge">⭐ 極高勝率推薦（${data.market}・${data.target_days}日）</span>
            <span style="font-size:0.75rem;color:var(--muted);">${data.checked_at || ""}</span>
          </div>
          <div class="rec-meta">標準：${data.criteria || ""}</div>
          ${cardsHtml}
        </div>`;
    }

    function selectAndAnalyze(sym) {
      document.getElementById("symbol").value = sym;
      document.getElementById("symbol").dataset.manual = "1";
      runAnalyze();
    }

    function renderResult(d) {
      const dirClass = d.direction.includes("多") ? "tag-up" : (d.direction.includes("空") ? "tag-down" : "tag-warn");
      const chgClass = d.chg_1d_pct >= 0 ? "tag-up" : "tag-down";
      const trackLabel = d.track_name || d.market;
      const rrText = d.rr_ratio ? `盈虧比 1:${d.rr_ratio}` : "";
      const st = d.structure || {};

      let riskHtml = "";
      if (d.risk) {
        const riskPctText = d.risk.risk_pct_label || "1.0%";
        riskHtml = `
          <div class="card">
            <div style="font-weight:700;margin-bottom:8px;">🛡️ 資金風控試算（單筆最大風險 ${riskPctText}）</div>
            <div class="metrics">
              <div class="metric"><div class="k">單筆最大容許虧損</div><div class="v">${d.risk.max_risk_2pct}</div></div>
              <div class="metric"><div class="k">建議名目倉位</div><div class="v">${d.risk.suggested_notional}</div></div>
              <div class="metric"><div class="k">建議數量 / 單位</div><div class="v">${d.risk.suggested_units}</div></div>
              <div class="metric"><div class="k">使用槓桿</div><div class="v">${d.risk.leverage}x</div></div>
            </div>
          </div>`;
      }

      const newsHtml = ((d.news && d.news.items) || []).map(n => {
        const sClass = n.sentiment === "偏多" ? "tag-up" : (n.sentiment === "偏空" ? "tag-down" : "tag-warn");
        return `<div class="news-item"><span class="${sClass}">[${n.sentiment}]</span> ${n.title}</div>`;
      }).join("") || `<div style="color:var(--muted);font-size:0.85rem;">目前無可用新聞標題</div>`;

      document.getElementById("resultArea").innerHTML = `
        <div class="card">
          <div class="track-row">
            <span class="track-badge">🧭 ${trackLabel}</span>
            ${rrText ? `<span class="rr-badge">⚖️ ${rrText}</span>` : ""}
          </div>
          <div class="status-banner">
            <div style="min-width:0;flex:1;">
              <div style="font-size:1.1rem;font-weight:700;">${d.symbol} <span class="${chgClass}" style="font-size:0.9rem;">(${d.chg_1d_pct >= 0 ? "+" : ""}${d.chg_1d_pct}%)</span></div>
              <div style="font-size:0.8rem;color:var(--muted);margin-top:2px;">最新價：${d.last_price}</div>
              <div style="font-size:0.78rem;color:var(--muted);">更新：${d.updated_at}</div>
            </div>
            <div style="text-align:right;max-width:44%;">
              <div class="${dirClass}" style="font-size:1.05rem;">${d.direction}</div>
              <div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">${d.action}</div>
            </div>
          </div>

          <div class="metrics">
            <div class="metric"><div class="k">建議入場點</div><div class="v">${d.entry_price}</div></div>
            <div class="metric"><div class="k">綜合看漲機率（${d.target_days}日）</div><div class="v">${d.blended_prob_up}%</div></div>
            <div class="metric"><div class="k">建議停損 / 停利</div><div class="v">${d.stop_loss} / ${d.take_profit}</div></div>
            <div class="metric"><div class="k">模型原始機率 / 測試準確</div><div class="v">${d.ml_prob_up}% / ${d.test_accuracy}%</div></div>
          </div>

          <div class="metrics" style="margin-top:8px;">
            <div class="metric"><div class="k">預估波動幅度</div><div class="v">±${d.expected_move_pct}%</div></div>
            <div class="metric"><div class="k">RSI(14)</div><div class="v">${d.indicators.rsi14}</div></div>
          </div>

          <div class="metrics" style="margin-top:8px;">
            <div class="metric" style="grid-column: span 2;"><div class="k">MA20 / MA60</div><div class="v">${d.indicators.ma20} / ${d.indicators.ma60}</div></div>
          </div>

          <div class="metric" style="margin-top:8px;">
            <div class="k">K 線與均線結構判讀</div>
            <div class="v" style="font-size:0.9rem;font-weight:600;">${st.summary || "—"}</div>
            <div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">${st.range_label || "20根K線"}高 / 低：${st.high_20 != null ? `${st.high_20} / ${st.low_20}` : "—"}</div>
          </div>
        </div>

        ${riskHtml}

        <div class="card">
          <div style="font-weight:700;margin-bottom:6px;">📰 新聞情緒：${d.news ? d.news.label : "—"}</div>
          ${newsHtml}
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("market").addEventListener("change", renderPresets);
      document.getElementById("symbol").addEventListener("input", () => {
        document.getElementById("symbol").dataset.manual = "1";
      });
      document.getElementById("runBtn").addEventListener("click", runAnalyze);
      document.getElementById("recBtn").addEventListener("click", runRecommend);
      renderPresets();
    });
  </script>
</body>
</html>
